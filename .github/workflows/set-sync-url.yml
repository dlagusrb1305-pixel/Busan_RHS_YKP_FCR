name: Set central sync URL once

on:
  push:
    paths:
      - '.github/workflows/set-sync-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set central sync URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const SYNC_URL   = "";'
          new = 'const SYNC_URL   = "https://script.google.com/macros/s/AKfycby0O6hLczUpuBzVeKNKYVPjMbqte75lT2zIRedLpKAcxdt1_eOIjmRtoIS6el_MYG0E/exec";'
          if old not in s:
              raise SystemExit('SYNC_URL placeholder not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set central Apps Script sync URL"
          git push
